[project]
name = "audiosearch"
version = "1.0.0"
description = "Hybrid (keyword + semantic) search over two-speaker audio transcripts"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's File()/Query() defaults are the framework idiom
    "SIM905",  # the stopword list reads better as one split string
    "RUF001",  # "·" and "–" in UI strings are intentional
]

[tool.ruff.lint.per-file-ignores]
"eval/report.py" = ["E501"]   # markdown table rows in the report template

[tool.ruff.lint.isort]
known-first-party = ["audiosearch", "backend", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
